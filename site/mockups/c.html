<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C — transcript</title>
<style>
  :root {
    --bg: #ffffff; --ink: #1c1d1f; --faint: #8b8f94; --line: #e8eaec;
    --ok: #1f7a4d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 13.5px/1.7 ui-monospace, "SF Mono", Menlo, monospace; }
  main { max-width: 620px; margin: 0 auto; padding: 48px 22px 72px; }

  .head { display: flex; gap: 14px; align-items: center; margin-bottom: 28px; }
  .head canvas { width: 72px; height: 72px; image-rendering: pixelated; border-radius: 2px; }
  .head p { margin: 0; }
  .head .t { font-size: 15px; }
  .head .s { color: var(--faint); font-size: 12.5px; }

  .line { display: grid; grid-template-columns: 62px 1fr; gap: 10px; padding: 3px 0; }
  .line .k { color: var(--faint); }
  .line.hl .v { color: var(--ok); }
  .line .v { white-space: pre-wrap; }

  hr { border: 0; border-top: 1px solid var(--line); margin: 22px 0; }

  .bar { display: inline-block; height: 8px; background: var(--line); vertical-align: middle;
         margin-right: 8px; border-radius: 1px; position: relative; width: 90px; }
  .bar i { position: absolute; inset: 0 auto 0 0; background: #c9ced4; }
  .hl .bar i { background: var(--ok); }

  .ask { margin-top: 6px; display: grid; grid-template-columns: 62px 1fr; gap: 10px; }
  .ask label { color: var(--faint); }
  .ask input { font: inherit; border: 0; border-bottom: 1px solid var(--line); background: none;
               color: inherit; padding: 2px 0; width: 100%; }
  .ask input:focus { outline: none; border-bottom-color: var(--ink); }

  .foot { color: var(--faint); font-size: 12.5px; margin-top: 34px; }
</style>
</head>
<body>
<main>
  <div class="head">
    <canvas id="cv" width="96" height="96"></canvas>
    <p>
      <span class="t">frame 1 of 6 — unlabelled</span><br>
      <span class="s" id="head-sub">encoder 43k params · rotation 64→256 · 24 prototypes</span>
    </p>
  </div>

  <div class="line"><span class="k">encode</span><span class="v" id="l-enc">—</span></div>
  <div class="line"><span class="k">rotate</span><span class="v" id="l-rot">—</span></div>
  <div class="line"><span class="k">nearest</span><span class="v" id="l-near">—</span></div>

  <hr>

  <div id="tail"></div>

  <hr>

  <div class="ask">
    <label for="q">describe</label>
    <input id="q" value="a tiny crimson disk" spellcheck="false">
  </div>
  <div class="line"><span class="k">score</span><span class="v" id="l-score" aria-live="polite">—</span></div>
  <div class="line"><span class="k"></span><span class="v" id="l-note" style="color:var(--faint)"></span></div>

  <p class="foot">Some output is wrong. This model gets 24.8 % of 24 classes on held-out scenes;
     the point of the page is the mechanism, not the score. On the ESP32-S3 the same weights take 471 ms.</p>
</main>

<script src="../engine.js"></script>
<script>
(async () => {
  const m = await loadModel('../model.json');
  const rgb = demoFrame(m, 0);
  const cv = document.getElementById('cv');
  const c = cv.getContext('2d');
  const id = c.createImageData(96, 96);
  for (let i = 0; i < 96 * 96; i++) {
    id.data[i * 4] = rgb[i * 3]; id.data[i * 4 + 1] = rgb[i * 3 + 1];
    id.data[i * 4 + 2] = rgb[i * 3 + 2]; id.data[i * 4 + 3] = 255;
  }
  c.putImageData(id, 0, 0);

  const t0 = performance.now();
  const e = embedImage(m, rgb);
  const y = rotate(m, e);
  const ms = performance.now() - t0;
  const r = rank(m, y);

  document.getElementById('l-enc').textContent =
    '96×96×3 → 48×48×24 → 24×24×48 → 12×12×64 → 64   ' + ms.toFixed(1) + ' ms';
  document.getElementById('l-rot').textContent =
    '(x − μa)·R + μb   ' + m.d_img + ' → ' + m.d_txt;
  document.getElementById('l-near').textContent = r[0].name + '   ' + r[0].score.toFixed(3);

  const max = r[0].score;
  document.getElementById('tail').innerHTML = r.slice(0, 6).map((x, i) => {
    const w = Math.round((x.score / max) * 90);
    return `<div class="line${i ? '' : ' hl'}"><span class="k">${i === 0 ? 'match' : ''}</span>` +
      `<span class="v"><span class="bar" style="width:90px"><i style="width:${w}px"></i></span>` +
      `${x.name.padEnd(16, '\u00a0')} ${x.score.toFixed(3)}</span></div>`;
  }).join('');

  const q = document.getElementById('q');
  const draw = () => {
    const t = encodeText(m, q.value);
    const sc = document.getElementById('l-score'), note = document.getElementById('l-note');
    if (!t) { sc.textContent = 'unknown words'; note.textContent = ''; return; }
    const s = cos(y, t);
    sc.textContent = s.toFixed(3) + (s > r[0].score ? '   above every class' : '');
    note.textContent = 'this sentence is encoded by the text encoder, then compared';
  };
  q.addEventListener('input', draw);
  draw();
})();
</script>
</body>
</html>
