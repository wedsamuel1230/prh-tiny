<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E — viewfinder</title>
<style>
  :root { --bg:#121211; --ink:#ece9e3; --dim:#8d8a83; --line:#2a2926; --warm:#d8d2c6; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font: 14px/1.55 ui-sans-serif, system-ui, sans-serif; }
  .stage { max-width: 760px; margin: 0 auto; padding: 44px 26px 72px; }

  .frame { position: relative; background:#000; border:1px solid var(--line);
           width: 100%; max-width: 380px; }
  .frame canvas { display:block; width:100%; height:auto; image-rendering: auto; }
  .corners { position:absolute; inset:14px; pointer-events:none; }
  .corners span { position:absolute; width:16px; height:16px; border:1px solid rgba(236,233,227,.5); }
  .corners span:nth-child(1){ top:0; left:0; border-right:0; border-bottom:0; }
  .corners span:nth-child(2){ top:0; right:0; border-left:0; border-bottom:0; }
  .corners span:nth-child(3){ bottom:0; left:0; border-right:0; border-top:0; }
  .corners span:nth-child(4){ bottom:0; right:0; border-left:0; border-top:0; }

  .readout { display:flex; justify-content:space-between; align-items:baseline; gap:20px;
             padding: 14px 2px 0; border-top: 1px solid var(--line); margin-top: 14px; }
  .label { font-size: 30px; letter-spacing:-0.015em; }
  .label small { display:block; font-size:12px; color:var(--dim); letter-spacing:0; margin-top:4px; }
  .dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--warm);
         margin-right:8px; vertical-align: 3px; }

  table { width:100%; border-collapse:collapse; margin-top:34px; }
  td { padding: 7px 0; border-bottom: 1px solid var(--line); }
  td.n { color: var(--dim); width: 46%; }
  td.v { text-align:right; font-variant-numeric: tabular-nums; }

  .ask { margin-top:30px; }
  .ask input { width:100%; background:none; border:0; border-bottom:1px solid var(--line);
               color:var(--ink); font:inherit; font-size:16px; padding:9px 0; }
  .ask input:focus { outline:none; border-bottom-color: var(--warm); }
  .ask p { color:var(--dim); margin:9px 0 0; font-size:13px; }
  .ask b { color:var(--ink); font-weight:500; font-variant-numeric: tabular-nums; }

  .hint { color: var(--dim); font-size: 12.5px; margin-top: 30px; line-height:1.6; }
</style>
</head>
<body>
<div class="stage">
  <div class="frame">
    <canvas id="cv" width="96" height="96"></canvas>
    <div class="corners"><span></span><span></span><span></span><span></span></div>
  </div>

  <div class="readout">
    <div class="label"><span class="dot"></span><span id="name">—</span>
      <small id="sub">one unlabelled frame, no ground truth shown</small></div>
    <div style="font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px" id="sc">—</div>
  </div>

  <table id="alts"></table>

  <div class="ask">
    <input id="q" value="something small and bright" aria-label="Describe the frame" spellcheck="false">
    <p id="res">—</p>
  </div>

  <p class="hint">The camera on an ESP32-S3 produces this frame in 96 × 96; the same weights take
     471 ms to name it there and about <span id="ms">—</span> in this tab. The vocabularies of
     images and sentences were never paired; only one rotation joins them.</p>
</div>

<script src="../engine.js"></script>
<script>
(async () => {
  const m = await loadModel('../model.json');
  const rgb = demoFrame(m, 0);
  const cv = document.getElementById('cv'), c = cv.getContext('2d');
  const id = c.createImageData(96, 96);
  for (let i = 0; i < 96 * 96; i++) {
    id.data[i*4] = rgb[i*3]; id.data[i*4+1] = rgb[i*3+1]; id.data[i*4+2] = rgb[i*3+2]; id.data[i*4+3] = 255;
  }
  c.putImageData(id, 0, 0);

  const t0 = performance.now();
  const y = rotate(m, embedImage(m, rgb));
  document.getElementById('ms').textContent = (performance.now() - t0).toFixed(0) + ' ms';

  const r = rank(m, y);
  document.getElementById('name').textContent = r[0].name;
  document.getElementById('sub').textContent = 'nearest of ' + m.names.length + ' caption prototypes';
  document.getElementById('sc').textContent = r[0].score.toFixed(3);
  document.getElementById('alts').innerHTML = r.slice(1, 6).map((x) =>
    `<tr><td class="n">${x.name}</td><td class="v">${x.score.toFixed(3)}</td></tr>`).join('');

  const q = document.getElementById('q'), res = document.getElementById('res');
  const draw = () => {
    const t = encodeText(m, q.value);
    if (!t) { res.textContent = 'Those words are outside the vocabulary.'; return; }
    const s = cos(y, t);
    res.innerHTML = `“${q.value}” scores <b>${s.toFixed(3)}</b> against this frame.` +
      (s > r[0].score ? ' Higher than every class name.' : '');
  };
  q.addEventListener('input', draw); draw();
})();
</script>
</body>
</html>
