<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D — ranked type</title>
<style>
  :root { --ink:#0f0f10; --dim:#8a8a8c; --rule:#e6e6e4; --bg:#fdfdfc; --hot:#0f0f10; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font: 15px/1.5 "Helvetica Neue", Inter, ui-sans-serif, system-ui, sans-serif; }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 48px 28px 80px;
          display: grid; grid-template-columns: 420px 1fr; gap: 64px; align-items: start; }

  .left { position: sticky; top: 48px; }
  .left canvas { width: 100%; height: auto; display:block; image-rendering: auto;
                 border-radius: 3px; background:#111; }
  .meta { margin-top: 14px; font-size: 13px; color: var(--dim); display:flex; gap:18px; flex-wrap:wrap; }
  .meta b { color: var(--ink); font-weight: 500; }

  .ask { margin-top: 26px; }
  .ask input { width: 100%; font: inherit; font-size: 15px; padding: 10px 0; border: 0;
               border-bottom: 1px solid var(--ink); background: none; }
  .ask input:focus { outline: none; border-bottom-width: 2px; }
  .ask .res { font-size: 13px; color: var(--dim); margin-top: 8px; }
  .ask .res b { color: var(--ink); font-variant-numeric: tabular-nums; }

  h1 { font-size: 15px; font-weight: 500; margin: 0 0 30px; color: var(--dim); }
  .list { list-style:none; margin:0; padding:0; }
  .list li { padding: 0; border-top: 1px solid var(--rule); }
  .list li:last-child { border-bottom: 1px solid var(--rule); }
  .list button { all: unset; cursor: default; display: grid; width: 100%;
                 grid-template-columns: 1fr auto; align-items: baseline; gap: 20px;
                 padding: 14px 0; }
  .list .word { font-size: calc(15px + var(--w) * 34px); line-height: 1.1;
                letter-spacing: -0.02em; }
  .list .num { font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .list li.first .word { font-weight: 600; }
  .list li.first .num { color: var(--ink); }

  .foot { grid-column: 1 / -1; margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--rule);
          display:flex; gap:32px; flex-wrap:wrap; font-size: 13px; color: var(--dim); }
  .foot b { color: var(--ink); font-weight: 500; }
  @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; gap: 34px; } .left { position: static; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="left">
    <canvas id="cv" width="96" height="96"></canvas>
    <div class="meta">
      <span>96 × 96 frame</span><span><b id="ms">—</b> in this tab</span><span><b>471 ms</b> on device</span>
    </div>
    <div class="ask">
      <input id="q" value="a tiny crimson disk" aria-label="Describe the frame" spellcheck="false">
      <p class="res" id="res">—</p>
    </div>
  </div>

  <div>
    <h1>Twenty-four sentences, ranked against one photograph</h1>
    <ol class="list" id="list"></ol>
  </div>

  <div class="foot">
    <span><b>0.78</b> alignment between the two encoders</span>
    <span><b id="acc">—</b> zero-shot on 24 classes</span>
    <span><b>64 KiB</b> of weights</span>
    <span>no image–label pair was used</span>
  </div>
</div>

<script src="../engine.js"></script>
<script>
(async () => {
  const m = await loadModel('../model.json');
  const rgb = demoFrame(m, 0);
  const cv = document.getElementById('cv'), c = cv.getContext('2d');
  const id = c.createImageData(96, 96);
  for (let i = 0; i < 96 * 96; i++) {
    id.data[i*4] = rgb[i*3]; id.data[i*4+1] = rgb[i*3+1]; id.data[i*4+2] = rgb[i*3+2]; id.data[i*4+3] = 255;
  }
  c.putImageData(id, 0, 0);

  const t0 = performance.now();
  const y = rotate(m, embedImage(m, rgb));
  document.getElementById('ms').textContent = (performance.now() - t0).toFixed(0) + ' ms';

  const r = rank(m, y).slice(0, 6);
  const lo = r[r.length - 1].score, hi = r[0].score;
  document.getElementById('list').innerHTML = r.map((x, i) => {
    const w = ((x.score - lo) / (hi - lo + 1e-9)).toFixed(3);
    return `<li class="${i ? '' : 'first'}"><button><span class="word" style="--w:${w}">${x.name}</span>` +
           `<span class="num">${x.score.toFixed(3)}</span></button></li>`;
  }).join('');

  document.getElementById('acc').textContent = (m.metrics.acc * 100).toFixed(1) + ' %';

  const q = document.getElementById('q'), res = document.getElementById('res');
  const draw = () => {
    const t = encodeText(m, q.value);
    if (!t) { res.textContent = 'No word here is in the vocabulary.'; return; }
    const s = cos(y, t);
    res.innerHTML = `Your sentence scores <b>${s.toFixed(3)}</b> — ` +
      (s > r[0].score ? 'higher than any class name.' : `the best class name scores <b>${r[0].score.toFixed(3)}</b>.`);
  };
  q.addEventListener('input', draw); draw();
})();
</script>
</body>
</html>
